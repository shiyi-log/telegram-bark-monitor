name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version="$(uv version --short)"
          tag_version="${RELEASE_TAG#v}"
          if [ "$project_version" != "$tag_version" ]; then
            printf 'Tag %s does not match pyproject.toml version %s\n' "$RELEASE_TAG" "$project_version" >&2
            exit 1
          fi

      - name: Verify backend
        run: |
          uv sync --frozen --all-groups
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

      - name: Build wheel and source distribution
        run: uv build

      # 校验静态页面随 wheel/sdist 发布，且源码包不包含本机依赖缓存。
      - name: Verify release package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open
          from zipfile import ZipFile

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "bark_monitor/static/index.html" in names
          assert any(name.startswith("bark_monitor/static/assets/") for name in names)
          with tar_open(sdist) as archive:
              names = archive.getnames()
          assert any(name.endswith("/bark_monitor/static/index.html") for name in names)
          assert not any("/frontend/node_modules/" in name for name in names)
          print(f"verified {wheel.name} and {sdist.name}")
          PY

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Release image smoke test
    runs-on: ubuntu-latest
    needs: distributions
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 标签发布也必须经过本地 dashboard、静态页面和鉴权冒烟检查。
      - name: Build image for smoke test
        run: docker build --tag bark-monitor:release-smoke .

      - name: Run dashboard smoke test
        run: python .github/scripts/docker_smoke.py bark-monitor:release-smoke

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [distributions, container-manifest]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: dist

      - name: Download Docker release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: container-release-*
          path: dist
          merge-multiple: true

      # 已公开的发行物不可覆盖；只允许继续先前失败留下的 draft。
      - name: Prepare a draft Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          release_id="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --jq .id)"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Build the Fuwu manifest and exact checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          python scripts/build_release_manifest.py \
            --dist dist --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" --project bark --require-docker
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish verified Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          dist = Path('dist')
          manifest = json.loads((dist / 'manifest.json').read_text())
          names = sorted(
              asset['path']
              for group in manifest['assets'].values()
              for asset in group
          ) + ['manifest.json', 'SHA256SUMS']
          assert len(names) == len(set(names))
          assert all(Path(name).name == name for name in names)
          assert all((dist / name).is_file() for name in names)
          tag = os.environ['RELEASE_TAG']
          # 仅上传清单声明的文件；失败 draft 中的旧资产也必须全部匹配后才能公开。
          subprocess.run(
              ['gh', 'release', 'upload', tag, *[str(dist / name) for name in names], '--clobber'],
              check=True,
          )
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--json', 'isDraft,assets'], text=True,
          ))
          assert release['isDraft'], 'Release must remain a draft until assets are verified'
          actual_names = [asset['name'] for asset in release['assets']]
          assert sorted(actual_names) == sorted(names), 'Release assets differ from the manifest'
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
          PY

  container-arch:
    name: Build and smoke ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    needs: [distributions, smoke]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # 每个架构只推送不可变 digest，避免 smoke 检查到的对象与最终发布对象不一致。
      - name: Build and publish image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          case "$IMAGE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Unexpected image digest: $IMAGE_DIGEST" >&2; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          printf '%s\n' "${IMAGE_DIGEST#sha256:}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Smoke test the exact published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python .github/scripts/docker_smoke.py "ghcr.io/${{ github.repository }}@${IMAGE_DIGEST}"

      # Fuwu 下载实际归档；GHCR 引用本身不能作为待下载的文件。
      - name: Export the verified image archive
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_ARCH: ${{ matrix.arch }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY}"
          archive_tag="${image}:${version}-${IMAGE_ARCH}"
          # 按不可变 digest 明确拉取目标架构，保证 save 使用刚通过冒烟的镜像。
          docker pull --platform "$IMAGE_PLATFORM" "${image}@${IMAGE_DIGEST}"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}@${IMAGE_DIGEST}")"
          test "$platform" = "$IMAGE_PLATFORM"
          docker tag "${image}@${IMAGE_DIGEST}" "$archive_tag"
          mkdir -p /tmp/release-assets
          docker save "$archive_tag" | gzip -n > "/tmp/release-assets/telegram_bark_monitor-${version}-linux-${IMAGE_ARCH}.docker.tar.gz"

      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-release-${{ matrix.arch }}
          path: /tmp/release-assets/*.docker.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    name: Publish multi-platform container manifest
    runs-on: ubuntu-24.04
    needs: container-arch
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: container-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Validate and merge image manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/digests/amd64)" -eq 65
          test "$(wc -c < /tmp/digests/arm64)" -eq 65
          amd64_digest="$(cat /tmp/digests/amd64)"
          arm64_digest="$(cat /tmp/digests/arm64)"
          printf '%s\n' "$amd64_digest" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$arm64_digest" | grep -Eq '^[0-9a-f]{64}$'
          amd64="ghcr.io/${{ github.repository }}@sha256:${amd64_digest}"
          arm64="ghcr.io/${{ github.repository }}@sha256:${arm64_digest}"
          version="${RELEASE_VERSION#v}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${version}" \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "$amd64" "$arm64"
          # v0.29.1 的 raw 输出保留 registry 原始字节且不追加换行，可直接计算 digest。
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}:${version}" > /tmp/container-index.json
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          raw = Path('/tmp/container-index.json').read_bytes()
          index = json.loads(raw)
          assert index['schemaVersion'] == 2
          assert index['mediaType'] in {
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
          }
          platforms = []
          for descriptor in index['manifests']:
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', descriptor['digest'])
              platform = descriptor.get('platform', {})
              pair = (platform.get('os'), platform.get('architecture'))
              # provenance 证明可能附带 unknown/unknown 描述符，不作为可运行架构。
              if pair != ('unknown', 'unknown'):
                  platforms.append(pair)
          assert sorted(platforms) == [('linux', 'amd64'), ('linux', 'arm64')], platforms
          digest = f'sha256:{hashlib.sha256(raw).hexdigest()}'
          Path('/tmp/container-index.digest').write_text(digest + '\n')
          print(f'verified {digest}: linux/amd64, linux/arm64')
          PY
          digest="$(cat /tmp/container-index.digest)"
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}@${digest}" > /tmp/container-index-verified.json
          cmp /tmp/container-index.json /tmp/container-index-verified.json

      - name: Create immutable image metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/release-assets
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          raw = Path('/tmp/container-index-verified.json').read_bytes()
          digest = f'sha256:{hashlib.sha256(raw).hexdigest()}'
          assert digest == Path('/tmp/container-index.digest').read_text().strip()
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          images = []
          for arch in ('amd64', 'arm64'):
              platform_digest = Path(f'/tmp/digests/{arch}').read_text().strip()
              assert re.fullmatch(r'[0-9a-f]{64}', platform_digest)
              images.append({'platform': f'linux/{arch}', 'digest': f'sha256:{platform_digest}'})
          result = {
              'schemaVersion': 1,
              'repository': f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}",
              'version': os.environ['RELEASE_TAG'].removeprefix('v'),
              'revision': os.environ['GITHUB_SHA'],
              'digest': digest,
              'images': images,
          }
          Path('/tmp/release-assets/container-image.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-release-metadata
          path: /tmp/release-assets/container-image.json
          if-no-files-found: error
          retention-days: 7

  fuwu:
    name: Publish to Fuwu
    needs: github-release
    permissions:
      contents: read
    uses: ./.github/workflows/fuwu-publish.yml
    with:
      tag: ${{ github.ref_name }}
      channel: stable
    secrets: inherit
