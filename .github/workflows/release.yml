name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version="$(uv version --short)"
          tag_version="${RELEASE_TAG#v}"
          if [ "$project_version" != "$tag_version" ]; then
            printf 'Tag %s does not match pyproject.toml version %s\n' "$RELEASE_TAG" "$project_version" >&2
            exit 1
          fi

      - name: Verify backend
        run: |
          uv sync --frozen --all-groups
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

      - name: Build wheel and source distribution
        run: uv build

      # 校验静态页面随 wheel/sdist 发布，且源码包不包含本机依赖缓存。
      - name: Verify release package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open
          from zipfile import ZipFile

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "bark_monitor/static/index.html" in names
          assert any(name.startswith("bark_monitor/static/assets/") for name in names)
          with tar_open(sdist) as archive:
              names = archive.getnames()
          assert any(name.endswith("/bark_monitor/static/index.html") for name in names)
          assert not any("/frontend/node_modules/" in name for name in names)
          print(f"verified {wheel.name} and {sdist.name}")
          PY

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Release image smoke test
    runs-on: ubuntu-latest
    needs: distributions
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 标签发布也必须经过本地 dashboard、静态页面和鉴权冒烟检查。
      - name: Build image for smoke test
        run: docker build --tag bark-monitor:release-smoke .

      - name: Run dashboard smoke test
        run: python .github/scripts/docker_smoke.py bark-monitor:release-smoke

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [distributions, container]
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi

  container:
    name: Publish multi-platform container
    runs-on: ubuntu-latest
    needs: [distributions, smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-platform manifest
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          image_ref="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          manifest="$(docker buildx imagetools inspect "$image_ref")"
          printf '%s\n' "$manifest" | grep -q 'linux/amd64'
          printf '%s\n' "$manifest" | grep -q 'linux/arm64'
