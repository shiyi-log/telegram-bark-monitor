name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 构建前先生成静态资源，保证 wheel 内含可直接打开的管理页面。
      - name: Set up Node.js for package build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for package
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Build Python distributions
        run: uv build

      # 校验发行包内容，防止本机构建缓存或前端依赖进入源码包。
      - name: Verify Python package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as tar_open
          from zipfile import ZipFile

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          sdist = next(dist.glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "bark_monitor/static/index.html" in names
          assert any(name.startswith("bark_monitor/static/assets/") for name in names)
          with tar_open(sdist) as archive:
              names = archive.getnames()
          assert any(name.endswith("/bark_monitor/static/index.html") for name in names)
          assert not any("/frontend/node_modules/" in name for name in names)
          print(f"verified {wheel.name} and {sdist.name}")
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high
          npm run build

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag bark-monitor:ci .

      # 检查健康端点、令牌、首页静态资源、配置保存和重启后的数据卷持久性。
      - name: Run dashboard smoke test
        run: python .github/scripts/docker_smoke.py bark-monitor:ci
